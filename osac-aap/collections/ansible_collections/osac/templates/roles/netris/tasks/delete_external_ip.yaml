---
# Release only the Netris reservation whose durable name contains this
# ExternalIP's Kubernetes UID. A pre-existing display-name reservation cannot
# be safely attributed to this object and is therefore left untouched.
- name: Validate ExternalIP identity before release
  ansible.builtin.assert:
    that:
      - external_ip.metadata.uid is defined
      - external_ip.metadata.uid | length > 0
      - external_ip.metadata.generation is defined
      - external_ip.metadata.namespace is defined
      - external_ip.spec.pool is defined
    fail_msg: >-
      ExternalIP UID, generation, namespace, and pool reference are required
      to release its provider reservation.

- name: Resolve the referenced ExternalIPPool for the release lock
  kubernetes.core.k8s_info:
    api_version: osac.openshift.io/v1alpha1
    kind: ExternalIPPool
    namespace: "{{ external_ip.metadata.namespace }}"
    label_selectors:
      - "osac.openshift.io/externalippool-uuid={{ external_ip.spec.pool }}"
  register: _eip_pool_lookup
  when: external_ip_pool is not defined

- name: Use the supplied ExternalIPPool for release
  ansible.builtin.set_fact:
    _eip_pool: "{{ external_ip_pool }}"
  when: external_ip_pool is defined

- name: Use the resolved ExternalIPPool for release
  ansible.builtin.set_fact:
    _eip_pool: "{{ _eip_pool_lookup.resources[0] }}"
  when: external_ip_pool is not defined and _eip_pool_lookup.resources | length == 1

- name: Verify the ExternalIPPool reference resolved uniquely for release
  ansible.builtin.assert:
    that:
      - _eip_pool is defined
      - _eip_pool.metadata.uid is defined
      - _eip_pool.metadata.namespace == external_ip.metadata.namespace
      - _eip_pool.metadata.labels['osac.openshift.io/externalippool-uuid'] == external_ip.spec.pool
    fail_msg: >-
      Could not resolve exactly the ExternalIPPool referenced by UUID
      '{{ external_ip.spec.pool }}' to serialize release with allocations.

- name: Set ExternalIP release lock identity
  ansible.builtin.set_fact:
    eip_name: "{{ external_ip.metadata.name }}"
    eip_uid: "{{ external_ip.metadata.uid }}"
    eip_lock_name: "external-ip-{{ _eip_pool.metadata.uid | hash('sha1') }}"
    eip_lock_namespace: "{{ external_ip.metadata.namespace }}"
    eip_lock_holder: >-
      {{ lookup('env', 'AWX_JOB_ID')
         | default(lookup('password', '/dev/null length=32'), true) }}

- name: Ensure Netris auth
  ansible.builtin.include_role:
    name: netris.controller.auth
  when: netris_session_cookie is not defined

- name: Release only the UID-owned Netris reservation while holding the pool Lease
  block:
    - name: Acquire the pool allocation Lease
      ansible.builtin.include_role:
        name: osac.service.vnet_lock
        tasks_from: acquire
      vars:
        vnet_lock_name: "{{ eip_lock_name }}"
        vnet_lock_namespace: "{{ eip_lock_namespace }}"
        vnet_lock_holder: "{{ eip_lock_holder }}"
        _vnet_lock_max_retries: 24
        _vnet_lock_retry_delay: 5

    - name: Find this ExternalIP UID's Netris reservation
      ansible.builtin.include_role:
        name: netris.controller.ipam
        tasks_from: read_subnets

    - name: Find a legacy name-keyed reservation for this ExternalIP
      ansible.builtin.set_fact:
        _eip_legacy_subnets: >-
          {{ netris_ipam_subnets
             | selectattr('name', 'equalto', eip_name)
             | rejectattr('name', 'equalto', 'osac-eip-' ~ eip_uid)
             | list }}

    - name: Keep release pending while an ambiguous legacy reservation exists
      ansible.builtin.assert:
        that:
          - _eip_legacy_subnets | length == 0
        fail_msg: >-
          Netris has a legacy reservation named '{{ eip_name }}' without an
          ExternalIP UID. Its owner cannot be proven, so release is blocked
          until an administrator safely migrates or removes that reservation.

    - name: Select the reservation owned by this UID
      ansible.builtin.set_fact:
        _eip_owned_subnet: >-
          {{ (netris_ipam_subnets
              | selectattr('name', 'equalto', 'osac-eip-' ~ eip_uid)
              | list | first | default(none)) }}

    - name: Delete the UID-owned Netris reservation
      ansible.builtin.include_role:
        name: netris.controller.ipam
        tasks_from: delete_subnet
      vars:
        ipam_name: "osac-eip-{{ eip_uid }}"
      when: _eip_owned_subnet is not none

    - name: Confirm the UID-owned Netris reservation is absent
      ansible.builtin.include_role:
        name: netris.controller.ipam
        tasks_from: read_subnets

    - name: Verify provider release completed
      ansible.builtin.assert:
        that:
          - >-
            netris_ipam_subnets
            | selectattr('name', 'equalto', 'osac-eip-' ~ eip_uid)
            | list | length == 0
        fail_msg: >-
          Netris reservation for ExternalIP UID '{{ eip_uid }}' still exists;
          release cannot be reported as complete.
  always:
    - name: Release the pool allocation Lease
      ansible.builtin.include_role:
        name: osac.service.vnet_lock
        tasks_from: release
      vars:
        vnet_lock_name: "{{ eip_lock_name }}"
        vnet_lock_namespace: "{{ eip_lock_namespace }}"
        vnet_lock_holder: "{{ eip_lock_holder }}"
