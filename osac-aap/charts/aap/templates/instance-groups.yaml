{{- $global := .Values.global | default dict }}
{{- $globalFabricManager := $global.fabricManager | default dict }}
{{- $netris := $globalFabricManager.netris | default dict }}
{{- $autoNetris := $netris.enabled | default false }}
{{- $clusterFulfillmentEnabled := or .Values.instanceGroups.clusterFulfillment.enabled $autoNetris }}
{{- $networkFulfillmentEnabled := or .Values.instanceGroups.networkFulfillment.enabled $autoNetris }}
{{- $clusterConfig := deepCopy (.Values.instanceGroups.clusterFulfillment.config | default dict) }}
{{- $clusterSecret := deepCopy (.Values.instanceGroups.clusterFulfillment.secret | default dict) }}
{{- $networkConfig := deepCopy (.Values.instanceGroups.networkFulfillment.config | default dict) }}
{{- $networkSecret := deepCopy (.Values.instanceGroups.networkFulfillment.secret | default dict) }}
{{- if $autoNetris }}
{{- $credentials := $netris.credentials | default dict }}
{{- $_ := set $clusterConfig "NETWORK_CLASS" "netris" }}
{{- $_ := set $clusterConfig "NETWORK_STEPS_COLLECTION" "netris.steps" }}
{{- $_ := set $clusterConfig "NETRIS_CONTROLLER_URL" $credentials.controllerURL }}
{{- $_ := set $clusterConfig "NETRIS_USERNAME" $credentials.username }}
{{- $_ := set $clusterConfig "NETRIS_SITE_ID" $credentials.siteID }}
{{- $_ := set $clusterConfig "NETRIS_TENANT_ID" $credentials.tenantID }}
{{- $_ := set $clusterConfig "NETRIS_TENANT_NAME" $credentials.tenantName }}
{{- $_ := set $clusterSecret "NETRIS_PASSWORD" $credentials.password }}
{{- $_ := set $networkConfig "NETRIS_CONTROLLER_URL" $credentials.controllerURL }}
{{- $_ := set $networkConfig "NETRIS_USERNAME" $credentials.username }}
{{- $_ := set $networkConfig "NETRIS_SITE_ID" $credentials.siteID }}
{{- $_ := set $networkConfig "NETRIS_TENANT_ID" $credentials.tenantID }}
{{- $_ := set $networkConfig "NETRIS_TENANT_NAME" $credentials.tenantName }}
{{- $_ := set $networkSecret "NETRIS_PASSWORD" $credentials.password }}
{{- end }}
{{- if $clusterFulfillmentEnabled }}
{{- $ingress := lookup "config.openshift.io/v1" "Ingress" "" "cluster" }}
{{- $ingressDomain := "" }}
{{- if $ingress }}{{- $ingressDomain = $ingress.spec.domain | default "" }}{{- end }}
{{- $baseDomain := "" }}
{{- if $ingressDomain }}
{{- $baseDomain = printf "hosted.%s" ($ingressDomain | trimPrefix "apps.") }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-fulfillment-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
data:
  {{- range $key, $val := $clusterConfig }}
  {{- if and $val (ne $key "HOSTED_CLUSTER_BASE_DOMAIN") }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  HOSTED_CLUSTER_BASE_DOMAIN: {{ $clusterConfig.HOSTED_CLUSTER_BASE_DOMAIN | default $baseDomain | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-fulfillment-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
type: Opaque
data:
  {{- range $key, $val := $clusterSecret }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-fulfillment-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: cluster-fulfillment-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
type: Opaque
data: {}
{{- end }}
---
{{- if $networkFulfillmentEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-fulfillment-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
data:
  {{- range $key, $val := $networkConfig }}
  {{- if $val }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: network-fulfillment-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
type: Opaque
data:
  {{- range $key, $val := $networkSecret }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-fulfillment-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: network-fulfillment-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
type: Opaque
data: {}
{{- end }}
---
{{- if .Values.instanceGroups.storageFulfillment.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-operations-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
data:
  {{- range $key, $val := .Values.instanceGroups.storageFulfillment.config }}
  {{- if $val }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-operations-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
type: Opaque
data:
  {{- range $key, $val := .Values.instanceGroups.storageFulfillment.secret }}
  {{- if $val }}
  {{ $key }}: {{ $val | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-operations-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-operations-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
type: Opaque
data: {}
{{- end }}
---
{{- if .Values.instanceGroups.publishTemplates.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: publish-templates-ig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osac-aap.labels" . | nindent 4 }}
    osac.openshift.io/project: osac-aap
data:
  OSAC_TEMPLATE_COLLECTIONS: {{ .Values.instanceGroups.publishTemplates.config.OSAC_TEMPLATE_COLLECTIONS | quote }}
  OSAC_FULFILLMENT_SERVICE_URI: {{ .Values.instanceGroups.publishTemplates.config.OSAC_FULFILLMENT_SERVICE_URI | quote }}
{{- end }}
