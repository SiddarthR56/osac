---
- name: Create an ExternalIP resource
  hosts: localhost
  gather_facts: false

  vars:
    external_ip: "{{ osac_job_vars.resource }}"
    external_ip_name: "{{ osac_job_vars.resource.metadata.name }}"
    implementation_strategy: >-
      {{ osac_job_vars.resource.metadata.annotations
         ['osac.openshift.io/implementation-strategy'] }}
    template_parameters: {}

  pre_tasks:
    - name: Show resource metadata
      ansible.builtin.debug:
        var: osac_job_vars.resource.metadata

  tasks:
    - name: Display ExternalIP information
      ansible.builtin.debug:
        msg:
          - "ExternalIP name: {{ external_ip_name }}"
          - "Implementation strategy: {{ implementation_strategy }}"
          - "Template parameters: {{ template_parameters }}"

    - name: Call the selected ExternalIP role
      ansible.builtin.include_role:
        name: "{{ template_id_override | default('osac.templates.' + (implementation_strategy | replace('-', '_'))) }}"
        tasks_from: create_external_ip

    - name: Publish the successful ExternalIP allocation result
      ansible.builtin.set_stats:
        data: >-
          {{
            {
              'osac_result': {
                'schemaVersion': 'v1',
                'operation': 'external_ip.allocate',
                'resourceUID': external_ip.metadata.uid,
                'generation': external_ip.metadata.generation | int,
                'data': {}
              }
            }
          }}
        per_host: false
        aggregate: true
