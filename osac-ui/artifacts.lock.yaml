---
# Hermeto/Cachi2 generic-backend lockfile: prefetches the pnpm npm package
# itself as a plain file artifact, so it can be installed offline
# (`npm install -g <local tarball>`) during a hermetic build instead of
# `npm install -g pnpm@<version>`, which needs live network access to the
# npm registry. Checksum verified directly against the tarball (sha256 and
# cross-checked against the sha512 in the npm registry's own published
# integrity metadata for this exact version).
metadata:
  version: "1.0"
artifacts:
  - download_url: "https://registry.npmjs.org/pnpm/-/pnpm-9.15.9.tgz"
    checksum: "sha256:cf86a7ad764406395d4286a6d09d730711720acc6d93e9dce9ac7ac4dc4a28a7"
    filename: "pnpm-9.15.9.tgz"
